name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（需与 backend/app/core/config.py 里的 APP_VERSION 一致，如 0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Verify version matches APP_VERSION
        shell: pwsh
        run: |
          $appVersion = (Select-String -Path backend/app/core/config.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $expected = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } else {
            '${{ github.ref_name }}'.TrimStart('v')
          }
          Write-Host "expected=$expected  APP_VERSION=$appVersion"
          if ($appVersion -ne $expected) {
            throw "版本号不一致：期望 $expected，但 backend/app/core/config.py 里是 $appVersion"
          }

      - name: Build frontend + exe
        shell: pwsh
        run: ./scripts/build.ps1 -Exe

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -SkipExe

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item dist/traffic-forwarding.exe out/
          Copy-Item dist/installer/*.exe out/
          Get-ChildItem out | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: out/*
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          # tag 推送时用现有 tag；手动触发时按输入的版本号创建 tag
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: out/*
          generate_release_notes: true
          draft: false
          prerelease: false
